name: Playwright

on:
  push:
    branches-ignore:
      - test-history
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cumulative-playwright-history-${{ github.repository }}
  cancel-in-progress: false

jobs:
  test:
    # Pinned to 24.04 to try a different apt mirror: on ubuntu-latest (26.04) the
    # us-east-2 EC2 mirror has stalled `playwright install --with-deps` for 20+ minutes.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TEST_ENV: local
      BASE_URL: http://127.0.0.1:9899
      LOGIN_USERNAME: ${{ secrets.TEST_LOGIN_USERNAME }}
      LOGIN_PASSWORD: ${{ secrets.TEST_LOGIN_PASSWORD }}
      PLAYWRIGHT_HISTORY_BRANCH: test-history
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Update app submodule to latest main
        run: |
          git submodule update --remote --init app
          echo "Testing app commit: $(git -C app rev-parse HEAD)"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      - name: Validate test credentials
        run: |
          if [ -z "$LOGIN_USERNAME" ] || [ -z "$LOGIN_PASSWORD" ]; then
            echo "Configure TEST_LOGIN_USERNAME and TEST_LOGIN_PASSWORD secrets for the bundled app."
            exit 1
          fi

      - run: npm ci

      - name: Restore cumulative test history
        run: |
          mkdir -p .playwright-history
          if git ls-remote --exit-code --heads origin "refs/heads/${PLAYWRIGHT_HISTORY_BRANCH}" >/dev/null 2>&1; then
            git fetch --no-tags origin "refs/heads/${PLAYWRIGHT_HISTORY_BRANCH}"
            git show FETCH_HEAD:history.json > .playwright-history/history.json
          fi

      - name: Install app dependencies
        run: npm ci --prefix app

      - name: Lint JavaScript
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Configure apt to fail fast on slow mirrors
        run: |
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\n' \
            | sudo tee /etc/apt/apt.conf.d/99ci-timeouts

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        timeout-minutes: 10
        run: npx playwright install-deps chromium

      - name: Test cumulative history logic
        run: npm run test:history:unit

      - name: Run Playwright tests
        id: playwright
        run: npm run test:local

      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
            .playwright-history/history.json
            reports/test-history-report*.html
          if-no-files-found: ignore

      - name: Persist cumulative test history
        if: always() && github.event_name != 'pull_request' && steps.playwright.outcome != 'skipped'
        run: bash scripts/persist-test-history.sh
